# Per-sensor and per-board trigger data for aurora-camera-denoise, keyed by
# [sensor:<name>] from the camera device's sysfs sensor attribute, falling back
# to the first device-tree compatible of the machine that has a section here.
#
# These levels drive the low-light stage; the temporal filter runs on every
# frame regardless (temporal = on, the default).
#
# enter-gain / exit-gain: total sensor gain in 1/256 steps (256 = unity), as
#   the camera driver reports it per frame (V4L2_CID_GAIN, read-only). The
#   stage turns on at >= enter-gain and off below exit-gain. These are the
#   macOS automatic video noise reduction thresholds for each machine.
# enter-noise / exit-noise: measured frame-to-frame luma noise (8-bit code
#   values). An independent second trigger for noise that is not explained
#   by gain, e.g. a camera running without its sensor tuning. 0 disables it.
# fps-threshold: only filter while the frame rate is at most this.
# ramp-down-frames / ramp-up-frames: fade the filter out / in over this many
#   frames instead of switching it on one frame.
#
# Any of these can be overridden per user, see denoise.conf.

# MacBook Neo (T8140)
[apple,j700]
enter-gain = 2304
exit-gain = 1792
enter-noise = 7
exit-noise = 5
fps-threshold = 30
ramp-down-frames = 30

# 12 MP Center Stage front ultra-wide sensor (IMX958, e.g. J614s/J616s/J614c/J616c)
[sensor:imx958-uw]
enter-gain = 3584
exit-gain = 2816
enter-noise = 7
exit-noise = 5
fps-threshold = 30
ramp-down-frames = 30

# Front ultra-wide sensor: capability only; each stream starts with framing off.
framing-supported = true
framing-zoom-min = 1.0
framing-zoom-max = 6.0
framing-zoom-default = 1.5

# MacBook Pro 16" (M4 Pro, T6040): the [sensor:imx958-uw] values, for kernels
# that do not report the camera's sensor (before linux#2216) and for the time
# before the camera is first detected. Drop it once every kernel reports it.
[apple,j616s]
enter-gain = 3584
exit-gain = 2816
enter-noise = 7
exit-noise = 5
fps-threshold = 30
ramp-down-frames = 30
framing-supported = true
framing-zoom-min = 1.0
framing-zoom-max = 6.0
framing-zoom-default = 1.5
