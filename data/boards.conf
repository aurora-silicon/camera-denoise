# Per-board trigger data for aurora-camera-denoise, keyed by the first
# device-tree compatible of the machine that has a section here.
#
# enter-gain / exit-gain: total sensor gain in 1/256 steps (256 = unity), as
#   the camera driver reports it per frame (V4L2_CID_GAIN, read-only). The
#   filter turns on at >= enter-gain and off below exit-gain. These are the
#   macOS automatic video noise reduction thresholds for each machine.
# enter-noise / exit-noise: measured frame-to-frame luma noise (8-bit code
#   values). An independent second trigger for noise that is not explained
#   by gain, e.g. a camera running without its sensor tuning. 0 disables it.
# fps-threshold: only filter while the frame rate is at most this.
# ramp-down-frames / ramp-up-frames: fade the filter out / in over this many
#   frames instead of switching it on one frame.
#
# Any of these can be overridden per user, see denoise.conf.

# MacBook Neo (T8140)
[apple,j700]
enter-gain = 2304
exit-gain = 1792
enter-noise = 7
exit-noise = 5
fps-threshold = 30
ramp-down-frames = 30

# MacBook Pro 16" (M4 Pro, T6040)
[apple,j616s]
enter-gain = 3584
exit-gain = 2816
enter-noise = 7
exit-noise = 5
fps-threshold = 30
ramp-down-frames = 30
