# aurora-camera-denoise settings. Copy to /etc/aurora-camera-denoise/denoise.conf
# (all users) or ~/.config/aurora-camera-denoise/denoise.conf (you; wins over
# /etc), then: systemctl --user reload aurora-camera-denoise
[denoise]
# auto: temporal filter always, low-light stage by sensor gain and noise (the default)
# on:   both stages always      off: never (frames pass through unchanged)
mode = auto

# on:  run the temporal filter on every frame, like macOS (the default)
# off: only filter above the low-light levels, with one backend
temporal = on

# The low-light stage. auto: the ANE backend when installed and usable,
# else none (with temporal = off: else the CPU). cpu: the CPU backend only
backend = auto

# CPU worker threads; 0 = one, which costs the least CPU. More threads lower
# the latency a little for more total CPU time.
threads = 0

# Board thresholds can be overridden here too, e.g. to filter sooner:
# enter-gain = 1536
# exit-gain = 1280
# or to only follow the gain, like macOS:
# enter-noise = 0
