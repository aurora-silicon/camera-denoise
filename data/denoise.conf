# aurora-camera-denoise settings. Copy to /etc/aurora-camera-denoise/denoise.conf
# (all users) or ~/.config/aurora-camera-denoise/denoise.conf (you; wins over
# /etc), then: systemctl --user reload aurora-camera-denoise
[denoise]
# auto: temporal filter always, low-light stage by sensor gain and noise (the default)
# on:   both stages always      off: never (frames pass through unchanged)
mode = auto

# on:  the camera may slow down to 15 fps in low light for a longer exposure,
#      like macOS (the default). off: hold the frame rate and raise the gain
low-light-frame-rate = on

# on:  run the temporal filter on every frame, like macOS (the default)
# off: only filter above the low-light levels, with one backend
temporal = on

# The temporal stage. auto (the default): the video encoder's
# motion-compensated filter, the one macOS uses, when the kernel has its
# device and the scaler's lossless form (same output as macOS for a fraction
# of the CPU energy), else the CPU. ave: the encoder's filter whenever its
# device is there (on NV12 when the scaler lacks the lossless form), else the
# CPU. cpu: the CPU. gpu: Vulkan compute when the GPU plugin is installed and
# works, else the CPU; it costs more energy than the CPU, so it is opt-in.
temporal-backend = auto

# The low-light stage. auto: the ANE backend when installed and usable,
# else none (with temporal = off: else the CPU). cpu: the CPU backend only,
# for both stages
backend = auto

# How strong the filter is (live with: systemctl --user reload aurora-camera-denoise)
# strength: the filtered picture mixed with the camera's, 0..1 (1 = filtered
#   only, the default; 0.5 = half each: half the grain comes back, and half
#   the softness goes)
# spatial: the 3x3 smoothing after the temporal filter, 0..1 (1 = default,
#   0 = none: finest detail and texture kept, some fine grain left)
# temporal-frames: the longest running mean, 2..8 frames (8 = default: the
#   smoothest still picture; fewer = less smear on motion, more grain)
strength = 1
spatial = 1
temporal-frames = 8

# The picture after the filter, live too. All neutral by default:
# vignette 0..1 brightens the corners (lens shading; 1 = twice the light in
#   the corners); brightness -1..1; contrast 0.5..2; saturation 0..2;
#   warmth -1..1 (blue..orange); tint -1..1 (green..magenta); sharpen 0..1
#vignette = 0
#brightness = 0
#contrast = 1
#saturation = 1
#warmth = 0
#tint = 0
#sharpen = 0

# CPU worker threads; 0 = one, which costs the least CPU. More threads lower
# the latency a little for more total CPU time.
threads = 0

# Board thresholds can be overridden here too, e.g. to filter sooner:
# enter-gain = 1536
# exit-gain = 1280
# or to only follow the gain, like macOS:
# enter-noise = 0

# Face framing (camera.framing on a named --stream output) is offered on boards
# whose data declares it. To opt in on another Mac, set it here; zoom is a
# digital crop of the camera image, so keep the maximum modest:
# framing-supported = true
# framing-zoom-min = 1.0
# framing-zoom-max = 2.0
# framing-zoom-default = 1.0
