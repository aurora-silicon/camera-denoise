# aurora-camera-denoise settings. Copy to /etc/aurora-camera-denoise/denoise.conf
# (all users) or ~/.config/aurora-camera-denoise/denoise.conf (you; wins over
# /etc), then: systemctl --user reload aurora-camera-denoise
[denoise]
# auto: follow the sensor gain and noise (the default)
# on:   always denoise          off: never (frames pass through unchanged)
mode = auto

# auto: the ANE backend when installed and usable, else the CPU
# cpu:  always the CPU backend
backend = auto

# CPU worker threads; 0 = one, which costs the least CPU. More threads lower
# the latency a little for more total CPU time.
threads = 0

# Board thresholds can be overridden here too, e.g. to filter sooner:
# enter-gain = 1536
# exit-gain = 1280
# or to only follow the gain, like macOS:
# enter-noise = 0

# Face framing (camera.framing on a named --stream output) is offered on boards
# whose data declares it. To opt in on another Mac, set it here; zoom is a
# digital crop of the camera image, so keep the maximum modest:
# framing-supported = true
# framing-zoom-min = 1.0
# framing-zoom-max = 2.0
# framing-zoom-default = 1.0
